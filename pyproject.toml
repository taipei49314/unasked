[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "unasked-research"
version = "0.2.1"
description = "A research harness for blind, evidence-gated repository investigation."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
keywords = ["evidence", "reproducibility", "repository", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.urls]
Repository = "https://github.com/taipei49314/unasked"
Issues = "https://github.com/taipei49314/unasked/issues"

[project.optional-dependencies]
dev = [
  "hatchling==1.31.0",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
security = [
  "bandit==1.9.4",
  "pip-audit==2.10.1",
]

[project.scripts]
unasked = "unasked.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unasked"]

[tool.hatch.build.targets.wheel.force-include]
"constitution" = "unasked/bundled/constitution"
"custody" = "unasked/bundled/custody"
"examples" = "unasked/bundled/examples"
"protocols" = "unasked/bundled/protocols"
"templates" = "unasked/bundled/templates"
"unasked-threat-model.md" = "unasked/bundled/unasked-threat-model.md"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
