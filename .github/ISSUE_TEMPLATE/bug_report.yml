name: Bug report
description: Report a reproducible software defect without sensitive data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not report vulnerabilities or include credentials, private source, sealed
        benchmarks, or unreviewed evidence workspaces. Use the Security tab for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: UNASKED version or commit
      placeholder: "0.2.1 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual behavior
      description: Include redacted JSON errors and exit codes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a disposable public fixture and remove sensitive paths.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, private source, benchmark cases, and sensitive evidence.
          required: true
        - label: This is not a vulnerability report.
          required: true
