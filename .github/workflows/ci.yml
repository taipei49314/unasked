name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned package manager
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
          version: "0.12.2"
      - name: Verify and install the lock
        run: |
          uv lock --check
          uv sync --locked --extra dev
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run the complete test suite
        run: uv run pytest

  security:
    name: Static and dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install the pinned package manager
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
          version: "0.12.2"
      - name: Install the locked security toolchain
        run: |
          uv lock --check
          uv sync --locked --extra security
      - name: Scan Python source
        run: uv run bandit -r src scripts -q
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/unasked-runtime.txt"
          uv run pip-audit -r "$RUNNER_TEMP/unasked-runtime.txt" --progress-spinner off

  build:
    name: Reproducible distributions
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install the pinned package manager
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
          version: "0.12.2"
      - name: Freeze the build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build twice from the same source
        run: |
          uv lock --check
          uv sync --locked --extra dev
          uv build --no-build-isolation --out-dir dist/one
          uv build --no-build-isolation --out-dir dist/two
      - name: Verify metadata, bytes, resources, and reproducibility
        run: >-
          python scripts/verify_release.py
          --dist dist/one
          --compare-dist dist/two
          --write-checksums
      - name: Smoke-test the wheel outside the checkout
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/unasked-runtime.txt"
          python -m venv "$RUNNER_TEMP/unasked-wheel"
          "$RUNNER_TEMP/unasked-wheel/bin/python" -m pip install --disable-pip-version-check --require-hashes -r "$RUNNER_TEMP/unasked-runtime.txt"
          "$RUNNER_TEMP/unasked-wheel/bin/python" -m pip install --disable-pip-version-check --no-deps dist/one/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" --version
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" --json doctor
          test "$("$RUNNER_TEMP/unasked-wheel/bin/unasked" --version)" = "unasked 0.4.0"
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" attestations verify --help
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" schemas show trust-policy > /dev/null
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" schemas show trial-run-matrix > /dev/null
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" --json resources export --destination unasked-kit
          test -f unasked-kit/protocols/m0-development-v0.1.json
          test -f unasked-kit/examples/m0-budget.json
          test -f unasked-kit/examples/trust-policy-shadow.json
          "$RUNNER_TEMP/unasked-wheel/bin/python" - <<'PY'
          import json
          from unasked.trials import ABLATION_VARIANTS, aggregate_trials, manifest_digest
          manifest = {
              "suite_id": "SHADOW-SMOKE",
              "cases": [
                  *[{"case_id": f"P-{i}", "kind": "POSITIVE", "impact_weight": 1} for i in range(5)],
                  *[{"case_id": f"C-{i}", "kind": "CONTROL", "impact_weight": 0} for i in range(2)],
              ],
              "custody": {"status": "UNSEALED", "independent": False, "sealed_before_explorer": False},
          }
          digest = manifest_digest(manifest)
          finding = lambda case: {"case_id": case["case_id"], **{name: False for name in ("claimed_verified", "verified", "unasked", "novel", "replay_passed", "counterevidence_passed", "external_authority", "decision_impact", "evidence_complete")}}
          results = [{"variant": variant, "manifest_hash": digest, "protocol_hash": "0" * 64, "normalized_budget": "1", "findings": [finding(case) for case in manifest["cases"]]} for variant in ABLATION_VARIANTS]
          with open("legacy-report.json", "w", encoding="utf-8") as stream:
              json.dump(aggregate_trials(manifest, results), stream)
          PY
          test "$("$RUNNER_TEMP/unasked-wheel/bin/unasked" --json trials certify --report legacy-report.json | jq -r '.data.claim')" = "M0_NOT_DEMONSTRATED"
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unasked-distributions-${{ github.sha }}
          path: dist/one/
          if-no-files-found: error
          retention-days: 14
