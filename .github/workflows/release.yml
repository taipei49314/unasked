name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build the exact annotated tag
    runs-on: ubuntu-latest
    outputs:
      tag_commit: ${{ steps.binding.outputs.tag_commit }}
      tag_object: ${{ steps.binding.outputs.tag_object }}
    steps:
      - name: Check out the exact tag without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the annotated tag, commit, and main history
        id: binding
        shell: bash
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          tag_object="$(git rev-parse "refs/tags/$GITHUB_REF_NAME")"
          tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install the pinned package manager
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
          version: "0.12.2"
      - name: Verify the tag and release notes
        run: |
          python scripts/verify_release.py --tag "$GITHUB_REF_NAME"
          test -f ".github/releases/${GITHUB_REF_NAME#v}.md"
      - name: Verify the tagged source
        run: |
          uv lock --check
          uv sync --locked --extra dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Build twice from the frozen tag
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --no-build-isolation --out-dir dist/one
          uv build --no-build-isolation --out-dir dist/two
      - name: Verify and checksum distributions
        run: >-
          python scripts/verify_release.py
          --tag "$GITHUB_REF_NAME"
          --dist dist/one
          --compare-dist dist/two
          --write-checksums
      - name: Smoke-test the wheel outside the checkout
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/unasked-runtime.txt"
          python -m venv "$RUNNER_TEMP/unasked-wheel"
          "$RUNNER_TEMP/unasked-wheel/bin/python" -m pip install --disable-pip-version-check --require-hashes -r "$RUNNER_TEMP/unasked-runtime.txt"
          "$RUNNER_TEMP/unasked-wheel/bin/python" -m pip install --disable-pip-version-check --no-deps dist/one/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" --json doctor
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" --json resources export --destination unasked-kit
          test -f unasked-kit/protocols/m0-development-v0.1.json
      - name: Upload only verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unasked-release-${{ github.sha }}
          path: dist/one/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish a verified draft, then make it public
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact tag without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the verified artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unasked-release-${{ github.sha }}
          path: dist/one
      - name: Recheck source binding and local artifact hashes without a write token
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.verify.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME")" = "$EXPECTED_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")" = "$EXPECTED_TAG_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_COMMIT"
          (cd dist/one && sha256sum --check SHA256SUMS.txt)
          python scripts/verify_release.py --tag "$GITHUB_REF_NAME" --dist dist/one
      - name: Create a verified draft and publish only after asset checks
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          created_draft=0
          cleanup_draft() {
            if test "$created_draft" = 1; then
              gh release delete "$GITHUB_REF_NAME" --yes || true
            fi
          }
          trap cleanup_draft ERR
          gh release create "$GITHUB_REF_NAME" \
            dist/one/*.whl \
            dist/one/*.tar.gz \
            dist/one/SHA256SUMS.txt \
            --verify-tag \
            --draft \
            --title "UNASKED $GITHUB_REF_NAME - Non-certifying M0 development path" \
            --notes-file ".github/releases/${GITHUB_REF_NAME#v}.md"
          created_draft=1
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" = 3
          for file in dist/one/*.whl dist/one/*.tar.gz dist/one/SHA256SUMS.txt; do
            name="$(basename "$file")"
            local_size="$(stat --format=%s "$file")"
            remote_size="$(gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets[] | select(.name == \"$name\") | .size")"
            test "$remote_size" = "$local_size"
          done
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          created_draft=0
          trap - ERR
