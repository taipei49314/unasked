name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify and build the exact annotated tag
    runs-on: ubuntu-latest
    outputs:
      tag_commit: ${{ steps.binding.outputs.tag_commit }}
      tag_object: ${{ steps.binding.outputs.tag_object }}
    steps:
      - name: Check out the exact tag without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Bind the annotated tag, commit, and main history
        id: binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref")"
          tag_record="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          test "$(jq -r '.tag' <<<"$tag_record")" = "$RELEASE_TAG"
          test "$(jq -r '.object.type' <<<"$tag_record")" = commit
          tag_commit="$(jq -r '.object.sha' <<<"$tag_record")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install the pinned package manager
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
          version: "0.12.2"
      - name: Verify the tag and release notes
        run: |
          python scripts/verify_release.py --tag "$RELEASE_TAG"
          test -f ".github/releases/${RELEASE_TAG#v}.md"
      - name: Verify the tagged source
        run: |
          uv lock --check
          uv sync --locked --extra dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Build twice from the frozen tag
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --no-build-isolation --out-dir dist/one
          uv build --no-build-isolation --out-dir dist/two
      - name: Verify and checksum distributions
        run: >-
          python scripts/verify_release.py
          --tag "$RELEASE_TAG"
          --dist dist/one
          --compare-dist dist/two
          --write-checksums
      - name: Smoke-test the wheel outside the checkout
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/unasked-runtime.txt"
          python -m venv "$RUNNER_TEMP/unasked-wheel"
          "$RUNNER_TEMP/unasked-wheel/bin/python" -m pip install --disable-pip-version-check --require-hashes -r "$RUNNER_TEMP/unasked-runtime.txt"
          "$RUNNER_TEMP/unasked-wheel/bin/python" -m pip install --disable-pip-version-check --no-deps dist/one/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" --json doctor
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" --json resources export --destination unasked-kit
          test -f unasked-kit/protocols/m0-development-v0.1.json
      - name: Upload only verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unasked-release-${{ github.sha }}
          path: dist/one/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish a verified draft, then make it public
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact tag without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Download the verified artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unasked-release-${{ github.sha }}
          path: dist/one
      - name: Recheck source binding and local artifact hashes without a write token
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.verify.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_COMMIT"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" refs/remotes/origin/main
          (cd dist/one && sha256sum --check SHA256SUMS.txt)
          python scripts/verify_release.py --tag "$RELEASE_TAG" --dist dist/one
      - name: Create a verified draft and publish only after asset checks
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.verify.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        run: |
          require_tag_on_main() {
            main_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_TAG_COMMIT...main" --jq .status)"
            test "$main_status" = identical || test "$main_status" = ahead
          }
          require_tag_on_main
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          created_draft=0
          cleanup_draft() {
            if test "$created_draft" = 1; then
              gh release delete "$RELEASE_TAG" --yes || true
            fi
          }
          trap cleanup_draft ERR
          gh release create "$RELEASE_TAG" \
            dist/one/*.whl \
            dist/one/*.tar.gz \
            dist/one/SHA256SUMS.txt \
            --verify-tag \
            --draft \
            --title "UNASKED $RELEASE_TAG - Non-certifying M0 development path" \
            --notes-file ".github/releases/${RELEASE_TAG#v}.md"
          created_draft=1
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 3
          for file in dist/one/*.whl dist/one/*.tar.gz dist/one/SHA256SUMS.txt; do
            name="$(basename "$file")"
            local_size="$(stat --format=%s "$file")"
            remote_size="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$name\") | .size")"
            test "$remote_size" = "$local_size"
          done
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          require_tag_on_main
          gh release edit "$RELEASE_TAG" --draft=false --latest
          created_draft=0
          trap - ERR
