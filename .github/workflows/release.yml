name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build the exact annotated tag
    runs-on: ubuntu-latest
    outputs:
      tag_commit: ${{ steps.binding.outputs.tag_commit }}
      tag_object: ${{ steps.binding.outputs.tag_object }}
    steps:
      - name: Check out the exact tag without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Bind the annotated tag, commit, and main history
        id: binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref")"
          tag_record="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          test "$(jq -r '.tag' <<<"$tag_record")" = "$RELEASE_TAG"
          test "$(jq -r '.object.type' <<<"$tag_record")" = commit
          tag_commit="$(jq -r '.object.sha' <<<"$tag_record")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install the pinned package manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.2"
      - name: Verify the tag and release notes
        run: |
          python scripts/verify_release.py --tag "$RELEASE_TAG"
          test -f ".github/releases/${RELEASE_TAG#v}.md"
      - name: Verify the tagged source
        run: |
          uv lock --check
          uv sync --locked --extra dev --extra security
          uv run ruff check .
          uv run ruff format --check .
          uv run bandit -q -r src scripts
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/unasked-runtime-audit.txt"
          uv run pip-audit -r "$RUNNER_TEMP/unasked-runtime-audit.txt" --progress-spinner off
          uv run pytest
      - name: Build twice from the frozen tag
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --no-build-isolation --out-dir dist/one
          uv build --no-build-isolation --out-dir dist/two
      - name: Verify and checksum distributions
        run: >-
          python scripts/verify_release.py
          --tag "$RELEASE_TAG"
          --dist dist/one
          --compare-dist dist/two
          --write-checksums
      - name: Smoke-test the wheel outside the checkout
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/unasked-runtime.txt"
          python -m venv "$RUNNER_TEMP/unasked-wheel"
          "$RUNNER_TEMP/unasked-wheel/bin/python" -m pip install --disable-pip-version-check --require-hashes -r "$RUNNER_TEMP/unasked-runtime.txt"
          "$RUNNER_TEMP/unasked-wheel/bin/python" -m pip install --disable-pip-version-check --no-deps dist/one/*.whl
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/unasked-wheel/bin/unasked" --version)" = "unasked ${RELEASE_TAG#v}"
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" --json doctor
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" attestations verify --help
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" schemas show trust-policy > /dev/null
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" schemas show trial-run-matrix > /dev/null
          "$RUNNER_TEMP/unasked-wheel/bin/unasked" --json resources export --destination unasked-kit
          test -f unasked-kit/protocols/m0-development-v0.1.json
          test -f unasked-kit/examples/trust-policy-shadow.json
          "$RUNNER_TEMP/unasked-wheel/bin/python" - <<'PY'
          import json
          from unasked.trials import ABLATION_VARIANTS, aggregate_trials, manifest_digest
          manifest = {
              "suite_id": "SHADOW-SMOKE",
              "cases": [
                  *[{"case_id": f"P-{i}", "kind": "POSITIVE", "impact_weight": 1} for i in range(5)],
                  *[{"case_id": f"C-{i}", "kind": "CONTROL", "impact_weight": 0} for i in range(2)],
              ],
              "custody": {"status": "UNSEALED", "independent": False, "sealed_before_explorer": False},
          }
          digest = manifest_digest(manifest)
          finding = lambda case: {"case_id": case["case_id"], **{name: False for name in ("claimed_verified", "verified", "unasked", "novel", "replay_passed", "counterevidence_passed", "external_authority", "decision_impact", "evidence_complete")}}
          results = [{"variant": variant, "manifest_hash": digest, "protocol_hash": "0" * 64, "normalized_budget": "1", "findings": [finding(case) for case in manifest["cases"]]} for variant in ABLATION_VARIANTS]
          with open("legacy-report.json", "w", encoding="utf-8") as stream:
              json.dump(aggregate_trials(manifest, results), stream)
          PY
          test "$("$RUNNER_TEMP/unasked-wheel/bin/unasked" --json trials certify --report legacy-report.json | jq -r '.data.claim')" = "M0_NOT_DEMONSTRATED"
      - name: Upload only verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unasked-release-${{ github.sha }}
          path: dist/one/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish a verified draft, then make it public
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact tag without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Download the verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unasked-release-${{ github.sha }}
          path: dist/one
      - name: Recheck source binding and local artifact hashes without a write token
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.verify.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_COMMIT"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" refs/remotes/origin/main
          (cd dist/one && sha256sum --check SHA256SUMS.txt)
          python scripts/verify_release.py --tag "$RELEASE_TAG" --dist dist/one
      - name: Create a verified draft and publish only after asset checks
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.verify.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        run: |
          require_release_binding() {
            main_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_TAG_COMMIT...main" --jq .status)"
            test "$main_status" = identical || test "$main_status" = ahead
            remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
            test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          }
          require_release_binding
          created_draft=0
          cleanup_draft() {
            if test "$created_draft" = 1; then
              gh release delete "$RELEASE_TAG" --yes || true
            fi
          }
          trap cleanup_draft ERR
          if existing_release_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$existing_release_state" = true
            gh release delete "$RELEASE_TAG" --yes
          fi
          require_release_binding
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "UNASKED $RELEASE_TAG - Authenticated evidence verification" \
            --notes-file ".github/releases/${RELEASE_TAG#v}.md"
          created_draft=1
          gh release upload "$RELEASE_TAG" \
            dist/one/*.whl \
            dist/one/*.tar.gz \
            dist/one/SHA256SUMS.txt
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 3
          for file in dist/one/*.whl dist/one/*.tar.gz dist/one/SHA256SUMS.txt; do
            name="$(basename "$file")"
            local_size="$(stat --format=%s "$file")"
            remote_size="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$name\") | .size")"
            test "$remote_size" = "$local_size"
          done
          require_release_binding
          gh release edit "$RELEASE_TAG" --draft=false --latest
          created_draft=0
          trap - ERR
